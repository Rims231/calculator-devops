---
- name: Deploy calculator application
  hosts: calculator
  become: yes

  vars:
    app_dir: /opt/calculator

  tasks:
    - name: Copy API source
      ansible.builtin.synchronize:
        src: ../calculator-api/
        dest: "{{ app_dir }}/calculator-api/"
        delete: yes
        rsync_opts:
          - "--exclude=target"
          - "--exclude=.git"

    - name: Copy UI source
      ansible.builtin.synchronize:
        src: ../calculator-ui/
        dest: "{{ app_dir }}/calculator-ui/"
        delete: yes
        rsync_opts:
          - "--exclude=node_modules"
          - "--exclude=dist"
          - "--exclude=.angular"
          - "--exclude=.git"

    - name: Copy docker-compose.yml
      ansible.builtin.copy:
        src: ../docker-compose.yml
        dest: "{{ app_dir }}/docker-compose.yml"

    - name: Fix ownership
      ansible.builtin.file:
        path: "{{ app_dir }}"
        owner: ec2-user
        group: ec2-user
        recurse: yes

    - name: Build and start containers
      ansible.builtin.shell: docker compose up -d --build
      args:
        chdir: "{{ app_dir }}"

    - name: Wait for the app to respond
      ansible.builtin.uri:
        url: http://localhost/health
        status_code: 200
      retries: 20
      delay: 10
      register: health
      until: health.status == 200

    - name: Show running containers
      ansible.builtin.shell: docker compose ps
      args:
        chdir: "{{ app_dir }}"
      register: ps_out
      changed_when: false

    - name: Report
      ansible.builtin.debug:
        msg: "{{ ps_out.stdout_lines }}"